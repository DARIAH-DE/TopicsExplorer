<div class="home-container">
  <section>
    <h1>Text corpus</h1>
    <input type="file" accept=".txt" multiple />
  </section>

  <section>
    <h1>Hyperparameters</h1>
    <form class="hyperparameters-form">
      <div class="input-container">
        <input type="number" id="topics" name="topics" />
        <label for="topics">Topics</label>
      </div>

      <div class="input-container">
        <input type="number" id="iterations" name="iterations" />
        <label for="iterations">Iterations</label>
      </div>

      <div class="input-container">
        <input type="number" id="alpha" name="alpha" />
        <label for="alpha">Alpha</label>
      </div>

      <div class="input-container">
        <input type="number" id="beta" name="beta" />
        <label for="beta">Beta</label>
      </div>
    </form>
  </section>
</div>
