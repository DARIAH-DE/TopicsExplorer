<section class="section">
  <div class="container">
    <div class="content">
      <h2>Relative Presence of {{ numTopics }} Topics in {{ numDocuments }} Documents</h2>
      <div class="topic-bar-container">
        @for (topic of topics; track topic.id) {
          <app-topic-bar [topic]="topic"></app-topic-bar>
        }
      </div>
    </div>
  </div>
</section>
